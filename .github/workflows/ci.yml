name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The committed Orval client must match openapi/openapi.json (incl. new files)
      - name: Generated API client is up to date
        run: npm run api:check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
